services:
  postgres:
    image: postgres:16-alpine
    container_name: prowexa_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-prowexa_whatsapp}
    volumes:
      - prowexa_pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: prowexa_redis
    restart: always
    volumes:
      - prowexa_redisdata:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: prowexa_backend
    restart: always
    ports:
      - "5050:5050"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5050/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      PORT: 5050
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:-https://wabtic.com}
      API_BASE_URL: ${API_BASE_URL:-https://api.wabtic.com}
      ADMIN_PANEL_URL: ${ADMIN_PANEL_URL:-https://app.wabtic.com}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.wabtic.com}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN}
      META_APP_SECRET: ${META_APP_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      META_SYSTEM_USER_TOKEN: ${META_SYSTEM_USER_TOKEN}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Prowexa <no-reply@wabtic.com>}
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: prowexa_frontend
    restart: always
    ports:
      - "8085:8080"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    depends_on:
      - backend

  website:
    build:
      context: ./wabtic-website
      dockerfile: Dockerfile
    container_name: prowexa_website
    restart: always
    ports:
      - "8086:8080"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  prowexa_pgdata:
  prowexa_redisdata:
