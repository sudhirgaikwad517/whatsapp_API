services:
  postgres:
    image: postgres:16-alpine
    container_name: prowexa_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: prowexa_whatsapp
    ports:
      - "5433:5432"
    volumes:
      - prowexa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: prowexa_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - prowexa_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  prowexa_pgdata:
  prowexa_redisdata:
